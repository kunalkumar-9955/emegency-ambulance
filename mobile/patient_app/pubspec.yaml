name: patient_app
description: Emergency Ambulance Patient App
publish_to: "none"
version: 1.0.0+100

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  map_kit:
    path: ../map_kit
  http: ^1.2.0
  provider: ^6.1.2
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  sqflite: ^2.3.3
  path: ^1.9.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  connectivity_plus: ^6.0.5
  intl: ^0.20.2
  pointycastle: ^3.9.1
  package_info_plus: ^8.0.2
  flutter_dotenv: ^5.2.1
  latlong2: ^0.9.1

  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

