name: map_kit
description: Free OpenStreetMap + OSRM map services for Emergency Ambulance apps
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cache: ^1.5.2
  flutter_dotenv: ^5.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
